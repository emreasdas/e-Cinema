<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birlikte İzle</title>
<style>
:root { --bg:#14141c; --panel:#1b1b24; --panel2:#252532; --line:#2d2d3c; --text:#e8e8ee; --muted:#a0a0b4; --accent:#6c5ce7; --ok:#55efc4; --nick:#a29bfe; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 9px 14px; background: var(--accent); color: #fff; font-weight: 600; }
button.sec { background: var(--panel2); color: var(--text); font-weight: 500; }
button:disabled { opacity: .6; cursor: default; }
input[type=text] { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid #3a3a4c; background: var(--panel2); color: var(--text); min-width: 0; width: 100%; }
label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }

/* Giriş */
#join { min-height: 100%; display: grid; place-items: center; padding: 16px; }
.card { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.card h1 { margin: 0 0 4px; font-size: 20px; }
.card p { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
.card button { width: 100%; margin-top: 18px; }
#joinErr { color: #ff7675; font-size: 13px; margin-top: 10px; min-height: 16px; }

/* Oda */
#room { height: 100%; height: 100dvh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
.bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.bar b { font-size: 15px; }
.bar .meta { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar button { padding: 6px 10px; font-size: 13px; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 340px; }
.stage { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.player { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; flex: none; }
#pv { position: absolute; inset: 0; }
#pv video, #pv iframe { width: 100%; height: 100%; border: 0; display: block; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--muted); font-size: 14px; }
#tap { position: absolute; z-index: 5; left: 50%; top: 50%; transform: translate(-50%,-50%); padding: 14px 20px; font-size: 16px; }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.row input { flex: 1; min-width: 160px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
#filehint { background: #3b2f12; border: 1px solid #7a5d1a; color: #ffd166; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
.tools { display: flex; gap: 8px; }

.chat { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
#msgs { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.sys { color: #8d8da3; font-size: 12px; font-style: italic; }
.msg { word-break: break-word; line-height: 1.35; }
.msg b { color: var(--nick); }
.msg.me b { color: var(--ok); }
.in { display: flex; gap: 8px; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }

@media (max-width: 820px) {
  main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); }
  .stage { overflow: visible; padding: 0; gap: 8px; }
  .player { border-radius: 0; }
  details, #filehint, .tools { margin: 0 8px; }
  .chat { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>

<div id="join">
  <div class="card">
    <h1>Birlikte İzle</h1>
    <p>Aynı videoyu arkadaşlarınla eş zamanlı izle.</p>
    <label for="name">Adın</label>
    <input type="text" id="name" maxlength="24" placeholder="örn. Ayşe" autocomplete="nickname">
    <label for="code">Oda kodu (herkes aynısını yazar)</label>
    <input type="text" id="code" maxlength="40" placeholder="örn. cuma-aksami" autocapitalize="none" autocomplete="off">
    <button id="joinBtn">Odaya katıl</button>
    <div id="joinErr"></div>
  </div>
</div>

<div id="room" hidden>
  <div class="bar">
    <b>Birlikte İzle</b>
    <span class="meta" id="meta"></span>
    <button class="sec" id="copy">Bağlantıyı kopyala</button>
    <button class="sec" id="leave">Çık</button>
  </div>
  <main>
    <section class="stage">
      <div class="player">
        <div id="pv"></div>
        <div class="empty" id="empty">Henüz video yok. Aşağıdan bir bağlantı yapıştır ya da dosya seç.</div>
        <button id="tap" hidden>▶ Dokun ve eşitle</button>
      </div>
      <div id="filehint" hidden></div>
      <div class="tools">
        <button class="sec" id="sync">Eşitle</button>
      </div>
      <details id="srcbox" open>
        <summary>Video seç / değiştir</summary>
        <div class="row">
          <input type="text" id="url" placeholder="YouTube veya .mp4 / .webm / .m3u8 bağlantısı" autocapitalize="none" autocomplete="off">
          <button id="load">Yükle</button>
        </div>
        <div class="row">
          <button class="sec" id="pick">Dosya seç (cihazından)</button>
          <input type="file" id="file" accept="video/*" hidden>
        </div>
        <div class="hint">Dosya seçersen odadaki herkes aynı dosyayı kendi cihazında seçmeli. Yalnızca oynatma durumu eşitlenir, dosya paylaşılmaz.</div>
      </details>
    </section>
    <aside class="chat">
      <div id="msgs"></div>
      <div class="in">
        <input type="text" id="inp" maxlength="500" placeholder="Mesaj yaz…" autocomplete="off">
        <button id="go">Gönder</button>
      </div>
    </aside>
  </main>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  let ws = null, joined = false, everJoined = false, leaving = false, myId = null;
  let roomCode = '', myName = '', reconnectTimer = null, pingTimer = null;
  let player = null, currentSource = null, pending = null, awaitingFile = false, users = [];

  /* ---------- Giriş formu ---------- */
  $('name').value = store.get('bi_name');
  let hashCode = '';
  try { hashCode = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  $('code').value = hashCode || store.get('bi_room');
  $('joinBtn').onclick = joinRoom;
  for (const id of ['name', 'code']) $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom(); });

  function joinRoom() {
    const code = $('code').value.trim();
    if (!code) { $('joinErr').textContent = 'Oda kodu yaz.'; return; }
    myName = $('name').value.trim() || 'Misafir';
    roomCode = code;
    store.set('bi_name', myName);
    store.set('bi_room', roomCode);
    history.replaceState(null, '', '#' + encodeURIComponent(roomCode));
    $('joinErr').textContent = '';
    $('joinBtn').disabled = true;
    leaving = false;
    everJoined = false;
    connect();
  }

  /* ---------- Bağlantı ---------- */
  function connect() {
    clearTimeout(reconnectTimer);
    const sock = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
    ws = sock;
    sock.onopen = () => {
      sock.send(JSON.stringify({ type: 'join', room: roomCode, name: myName }));
      clearInterval(pingTimer);
      pingTimer = setInterval(() => send({ type: 'ping' }), 20000);
    };
    sock.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch (err) { return; }
      handle(m);
    };
    sock.onclose = () => {
      if (ws !== sock) return;
      clearInterval(pingTimer);
      joined = false;
      if (leaving) return;
      if (!everJoined) {
        $('joinErr').textContent = 'Sunucuya bağlanılamadı.';
        $('joinBtn').disabled = false;
        return;
      }
      $('meta').textContent = 'Yeniden bağlanıyor…';
      reconnectTimer = setTimeout(connect, 2000);
    };
    sock.onerror = () => {};
  }

  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

  function handle(m) {
    switch (m.type) {
      case 'welcome':
        myId = m.id; joined = true;
        if (!everJoined) {
          everJoined = true;
          $('join').hidden = true;
          $('room').hidden = false;
          addSys('Odaya katıldın. Arkadaşlarına oda kodunu ya da "Bağlantıyı kopyala" ile bağlantıyı gönder.');
        }
        updateMeta();
        send({ type: 'getState' });
        break;
      case 'users': users = m.list || []; updateMeta(); break;
      case 'system': addSys(m.text); break;
      case 'chat': addChat(m); break;
      case 'sync': applyRemote(m); if (m.text) addSys(m.text); break;
      case 'source': setSource(m.source); if (m.text) addSys(m.text); break;
      case 'state':
        if (m.source) setSource(m.source);
        if (!m.empty) applyRemote(m);
        break;
    }
  }

  function updateMeta() {
    $('meta').textContent = `Oda: ${roomCode} · ${users.length || 1} kişi`;
    $('meta').title = users.join(', ');
  }

  /* ---------- Senkron ---------- */
  function localEvent(action, time) {
    if (!joined) return;
    send({ type: 'sync', action, time });
  }

  function applyRemote(m) {
    if (!player) return;
    if (!player.ready) { pending = { playing: m.playing, time: m.time, at: Date.now() }; return; }
    let t = m.time;
    if (m.at && m.playing) t += (Date.now() - m.at) / 1000;
    if (Math.abs(player.getTime() - t) > 0.7) player.seek(t);
    if (m.playing && !player.isPlaying()) player.play();
    else if (!m.playing && player.isPlaying()) player.pause();
  }

  function playerReady() {
    if (!player) return;
    player.ready = true;
    if (pending) { const p = pending; pending = null; applyRemote(p); }
  }

  function blocked() { $('tap').hidden = false; }
  $('tap').onclick = () => {
    $('tap').hidden = true;
    if (player) player.play();
    send({ type: 'getState' });
  };
  $('sync').onclick = () => send({ type: 'getState' });

  /* ---------- Oynatıcılar ---------- */
  const scripts = {};
  function loadScript(src) {
    if (!scripts[src]) {
      scripts[src] = new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = src; s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    return scripts[src];
  }

  function html5Player(url) {
    const v = document.createElement('video');
    v.controls = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('playsinline', '');
    let quietUntil = 0, expectSeeked = false, expectTimer = null, hls = null, isReady = false;
    const quiet = () => Date.now() < quietUntil;

    v.addEventListener('play', () => { if (!quiet()) localEvent('play', v.currentTime); });
    v.addEventListener('pause', () => { if (!quiet() && !v.ended) localEvent('pause', v.currentTime); });
    v.addEventListener('seeked', () => {
      if (expectSeeked) { expectSeeked = false; return; }
      if (!quiet()) localEvent('seek', v.currentTime);
    });
    v.addEventListener('loadedmetadata', () => { if (!isReady) { isReady = true; playerReady(); } });
    v.addEventListener('error', () => addSys('Video yüklenemedi. Doğrudan .mp4/.webm/.m3u8 bağlantısı olmalı; http bağlantılar https sayfada engellenir.'));
    $('pv').appendChild(v);

    if (/\.m3u8(\?|#|$)/i.test(url) && !v.canPlayType('application/vnd.apple.mpegurl')) {
      loadScript('https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js').then(() => {
        if (window.Hls && Hls.isSupported()) {
          hls = new Hls();
          hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) addSys('Video akışı yüklenemedi.'); });
          hls.loadSource(url);
          hls.attachMedia(v);
        } else { v.src = url; }
      }).catch(() => addSys('HLS kütüphanesi yüklenemedi.'));
    } else {
      v.src = url;
    }

    const api = {
      ready: false,
      getTime: () => v.currentTime,
      isPlaying: () => !v.paused,
      play() {
        quietUntil = Date.now() + 1500;
        const p = v.play();
        if (p && p.catch) p.catch(blocked);
      },
      pause() { quietUntil = Date.now() + 1500; v.pause(); },
      seek(t) {
        quietUntil = Date.now() + 1500;
        expectSeeked = true;
        clearTimeout(expectTimer);
        expectTimer = setTimeout(() => { expectSeeked = false; }, 5000);
        v.currentTime = t;
      },
      destroy() {
        try { v.pause(); } catch (e) {}
        if (hls) hls.destroy();
        v.removeAttribute('src'); v.load(); v.remove();
        if (url.startsWith('blob:')) URL.revokeObjectURL(url);
      },
    };
    return api;
  }

  function ytPlayer(id) {
    const holder = document.createElement('div');
    $('pv').appendChild(holder);
    let p = null, quietUntil = 0, lastT = 0, lastTs = Date.now(), lastPlaying = false, poll = null, blockTimer = null, dead = false;
    const quiet = () => Date.now() < quietUntil;
    const state = () => (p && p.getPlayerState ? p.getPlayerState() : -1);

    const api = {
      ready: false,
      getTime: () => (api.ready ? p.getCurrentTime() : 0),
      isPlaying: () => { const s = state(); return s === 1 || s === 3; },
      play() {
        quietUntil = Date.now() + 1500;
        p.playVideo();
        clearTimeout(blockTimer);
        blockTimer = setTimeout(() => { const s = state(); if (!dead && s !== 1 && s !== 3) blocked(); }, 2000);
      },
      pause() { quietUntil = Date.now() + 1500; p.pauseVideo(); },
      seek(t) {
        quietUntil = Date.now() + 1500;
        lastT = t; lastTs = Date.now();
        p.seekTo(t, true);
      },
      destroy() { dead = true; clearInterval(poll); clearTimeout(blockTimer); try { p && p.destroy(); } catch (e) {} },
    };

    const ytReady = new Promise((res) => {
      if (window.YT && YT.Player) return res();
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
      loadScript('https://www.youtube.com/iframe_api').catch(() => addSys('YouTube yüklenemedi.'));
    });

    ytReady.then(() => {
      if (dead) return;
      p = new YT.Player(holder, {
        videoId: id, width: '100%', height: '100%',
        playerVars: { playsinline: 1, rel: 0 },
        events: {
          onReady: () => {
            if (dead) return;
            api.ready = true;
            poll = setInterval(() => {
              const t = p.getCurrentTime(), now = Date.now();
              const expected = lastT + (lastPlaying ? (now - lastTs) / 1000 : 0);
              if (Math.abs(t - expected) > 1.5 && !quiet()) localEvent('seek', t);
              lastT = t; lastTs = now; lastPlaying = state() === 1;
            }, 500);
            playerReady();
          },
          onStateChange: (e) => {
            if (e.data === 1) { clearTimeout(blockTimer); if (!quiet()) localEvent('play', p.getCurrentTime()); }
            else if (e.data === 2) { if (!quiet()) localEvent('pause', p.getCurrentTime()); }
          },
          onError: () => addSys('YouTube videosu açılamadı (gömmeye kapalı ya da kaldırılmış olabilir).'),
        },
      });
    });
    return api;
  }

  function destroyPlayer() {
    if (player) { player.destroy(); player = null; }
    pending = null;
    $('pv').innerHTML = '';
    $('tap').hidden = true;
    $('empty').hidden = false;
  }

  function openSource(src, fileObj) {
    destroyPlayer();
    $('empty').hidden = true;
    if (src.kind === 'youtube') player = ytPlayer(src.value);
    else if (src.kind === 'url') player = html5Player(src.value);
    else if (src.kind === 'file' && fileObj) player = html5Player(URL.createObjectURL(fileObj));
  }

  /* ---------- Video kaynağı ---------- */
  const sameSrc = (a, b) => a && b && a.kind === b.kind && a.value === b.value;

  function setSource(src) {
    if (!src || sameSrc(src, currentSource)) return;
    currentSource = src;
    awaitingFile = false;
    $('filehint').hidden = true;
    $('srcbox').open = false;
    if (src.kind === 'file') {
      destroyPlayer();
      awaitingFile = true;
      $('filehint').textContent = `Odada "${src.label}" dosyası oynatılıyor. "Video seç / değiştir" bölümünden aynı dosyayı kendi cihazında seç.`;
      $('filehint').hidden = false;
      $('srcbox').open = true;
      return;
    }
    openSource(src);
  }

  function ytId(s) {
    s = s.trim();
    if (/^[\w-]{11}$/.test(s)) return s;
    try {
      const u = new URL(s);
      const h = u.hostname.replace(/^www\.|^m\./, '');
      if (h === 'youtu.be') { const id = u.pathname.slice(1, 12); return /^[\w-]{11}$/.test(id) ? id : null; }
      if (h.endsWith('youtube.com')) {
        const v = u.searchParams.get('v');
        if (v && /^[\w-]{11}$/.test(v.slice(0, 11))) return v.slice(0, 11);
        const m = u.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]{11})/);
        if (m) return m[1];
      }
    } catch (e) {}
    return null;
  }

  function publishSource(src, fileObj) {
    currentSource = src;
    awaitingFile = false;
    $('filehint').hidden = true;
    openSource(src, fileObj);
    send({ type: 'source', source: src });
    $('srcbox').open = false;
  }

  $('load').onclick = () => {
    const val = $('url').value.trim();
    if (!val) return;
    const id = ytId(val);
    if (id) {
      publishSource({ kind: 'youtube', value: id, label: 'YouTube videosu' });
    } else if (/^https?:\/\//i.test(val)) {
      let host = val;
      try { host = new URL(val).hostname; } catch (e) {}
      publishSource({ kind: 'url', value: val, label: host });
    } else {
      addSys('Geçerli bir YouTube ya da http(s) video bağlantısı yaz.');
      return;
    }
    $('url').value = '';
  };
  $('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('load').click(); });

  $('pick').onclick = () => $('file').click();
  $('file').onchange = (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (awaitingFile && currentSource && currentSource.kind === 'file') {
      const size = currentSource.value.slice(currentSource.value.lastIndexOf('|') + 1);
      if (size && String(f.size) !== size) addSys('Uyarı: bu dosyanın boyutu odadakinden farklı, aynı dosya olmayabilir.');
      awaitingFile = false;
      $('filehint').hidden = true;
      openSource(currentSource, f);
      $('srcbox').open = false;
      send({ type: 'getState' });
    } else {
      publishSource({ kind: 'file', value: `${f.name}|${f.size}`, label: f.name }, f);
    }
  };

  /* ---------- Sohbet ---------- */
  function pushNode(node) {
    const box = $('msgs');
    const near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.appendChild(node);
    while (box.children.length > 300) box.firstChild.remove();
    if (near) box.scrollTop = box.scrollHeight;
  }
  function addSys(text) {
    const d = document.createElement('div');
    d.className = 'sys';
    d.textContent = text;
    pushNode(d);
  }
  function addChat(m) {
    const me = m.fromId === myId;
    const d = document.createElement('div');
    d.className = 'msg' + (me ? ' me' : '');
    const b = document.createElement('b');
    b.textContent = (me ? 'Sen' : m.name) + ': ';
    d.appendChild(b);
    d.appendChild(document.createTextNode(m.text));
    pushNode(d);
  }
  function submitChat() {
    const text = $('inp').value.trim();
    if (!text) return;
    send({ type: 'chat', text });
    $('inp').value = '';
  }
  $('go').onclick = submitChat;
  $('inp').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitChat(); });

  /* ---------- Üst çubuk ---------- */
  $('copy').onclick = async () => {
    const link = location.origin + location.pathname + '#' + encodeURIComponent(roomCode);
    try { await navigator.clipboard.writeText(link); $('copy').textContent = 'Kopyalandı ✓'; }
    catch (e) { window.prompt('Bağlantıyı kopyala:', link); }
    setTimeout(() => { $('copy').textContent = 'Bağlantıyı kopyala'; }, 1500);
  };
  $('leave').onclick = () => {
    leaving = true;
    clearTimeout(reconnectTimer);
    if (ws) ws.close();
    destroyPlayer();
    currentSource = null; awaitingFile = false; users = [];
    $('msgs').innerHTML = '';
    $('filehint').hidden = true;
    $('srcbox').open = true;
    $('room').hidden = true;
    $('join').hidden = false;
    $('joinBtn').disabled = false;
  };
})();
</script>
</body>
</html>
